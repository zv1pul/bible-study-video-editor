# Every change is checked on a Mac and on Windows before it can reach anyone.
# A version tag (see release.yml) builds the downloads only if these pass.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-local.txt -c constraints.txt ruff
      - name: Lint
        run: ruff check --select E9,F63,F7,F82,F401,F841 *.py tests/*.py packaging/*.py
      - name: Accuracy checks — every case a real lesson once got wrong
        run: python tests/test_units.py
      - name: Self-check — the page loads, a test video renders, artwork is present
        run: python selfcheck.py --update-gate
      - name: Updates — good ones install, bad ones are refused or rolled back
        run: python tests/test_updater.py
      - name: A three-minute countdown, in a folder with an awkward name
        run: python tests/run_long_countdown.py
      - name: Test lessons — transcribe, match, verify, lay out and render eight lessons
        run: |
          python tests/build_corpus.py "$RUNNER_TEMP/corpus"
          python tests/run_corpus.py "$RUNNER_TEMP/corpus" offline
      - name: Source formats — phone, 4K, 480p, .mov, .webm, 30.01 fps
        run: |
          python tests/build_formats.py "$RUNNER_TEMP/formats"
          python tests/run_formats.py "$RUNNER_TEMP/formats"

  # Intel Macs: libraries can stop being made for them (onnxruntime did),
  # which only ever showed up when the download was built.
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-local.txt -c constraints.txt
      - name: Accuracy checks
        run: python tests/test_units.py
      - name: Self-check — the page loads, a test video renders, sound decodes
        run: python selfcheck.py --update-gate
      - name: A three-minute countdown
        run: python tests/run_long_countdown.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-local.txt -c constraints.txt
      - name: Accuracy checks
        run: python tests/test_units.py
      - name: Self-check
        run: python selfcheck.py --update-gate
      - name: Updates
        run: python tests/test_updater.py
      - name: A three-minute countdown (once longer than Windows allows a command to be)
        run: python tests/run_long_countdown.py
      - name: The "Choose the video" window can be built
        run: |
          python -c "import ast,subprocess,sys; src=open('app.py',encoding='utf-8').read(); tree=ast.parse(src); ns={'VIDEO_EXTENSIONS':('mp4','mov')}; fn=[n for n in tree.body if getattr(n,'name','')=='windows_picker_command'][0]; exec(compile(ast.Module([fn],[]),'app.py','exec'),ns); out=subprocess.run(ns['windows_picker_command'](show=False),capture_output=True,text=True); print(out.stdout, out.stderr); sys.exit(0 if 'PICKER READY' in out.stdout else 1)"
      - name: Source formats
        run: |
          python tests/build_formats.py "$env:RUNNER_TEMP\formats"
          python tests/run_formats.py "$env:RUNNER_TEMP\formats"
