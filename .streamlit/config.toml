[server]
# Serve finished videos straight from disk over HTTP. Without this the only
# way to hand somebody a file is st.download_button, which loads the whole
# thing into memory first — fine for a short clip, fatal for a full lesson on
# a small server. With it, the browser fetches the file directly and Python
# never touches the bytes, so size stops mattering.
enableStaticServing = true
maxUploadSize = 200           # megabytes.
                              #
                              # Deliberately low. Streamlit holds an upload in
                              # memory for the whole session, and a hosted app
                              # has about 1 GB in total, so a large upload
                              # kills the container with an unexplained error
                              # page. Streamlit enforces this limit itself and
                              # says so plainly in the uploader, which is a far
                              # better experience than a crash.
                              #
                              # It is not a limit on what the tool can handle.
                              # Larger recordings go in by link (streamed
                              # straight to disk) or, locally, by path (read
                              # from disk). Neither has any size limit.


[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#FFCA5C"
