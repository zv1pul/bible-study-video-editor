[server]
maxUploadSize = 1024          # megabytes. Streamlit buffers an upload in
                              # memory, so this must stay inside the host's
                              # RAM. A free hosted app has about 1 GB in
                              # total; locally, use "Use a file already on
                              # this computer" for anything large — it reads
                              # from disk with no limit at all.


[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#FFCA5C"
